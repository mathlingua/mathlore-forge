steps:
  # 1. Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', '$_REGION-docker.pkg.dev/$PROJECT_ID/mathlore-forge/app:$COMMIT_SHA', '-t', '$_REGION-docker.pkg.dev/$PROJECT_ID/mathlore-forge/app:latest', '-f', 'infra/Dockerfile', '.']

  # 2. Push Docker image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', '$_REGION-docker.pkg.dev/$PROJECT_ID/mathlore-forge/app']

  # 3. Deploy Cloud Run Service
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'mathlore-forge-web'
      - '--image'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/mathlore-forge/app:$COMMIT_SHA'
      - '--region'
      - '$_REGION'
      - '--platform'
      - 'managed'

  # 4. Deploy Cloud Run Job
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'deploy'
      - 'mathlore-forge-worker'
      - '--image'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/mathlore-forge/app:$COMMIT_SHA'
      - '--region'
      - '$_REGION'

substitutions:
  _REGION: 'us-central1'

options:
  logging: CLOUD_LOGGING_ONLY
